data_config: configs/data.yaml
experiment_config: configs/experiments.yaml
panel_file: data/features/grid_month_panel.parquet
neighbors_file: data/features/neighbors.parquet
poi_dir: data/features/poi_sparse
split_dir: data/splits
split_experiment: cross_city_multisource_tokyo
artifact_dir: outputs/cross_city_multisource_tokyo_dense/runs
report_dir: outputs/cross_city_multisource_tokyo_dense/reports
seed: 42
device: auto
models: [opencarbon_monthly]
training:
  representation_dim: 128
  dropout: 0.2
  learning_rate: 0.0003
  weight_decay: 0.0001
  max_epochs: 25
  contrastive_warmup_epochs: 5
  contrastive_weight: 0.01
  patience: 8
  batch_size: 36
  gradient_accumulation: 2
  amp: true
  num_workers: 2
  temperature: 0.07
  record_train_r2: false
