data_config: configs/data.yaml
experiment_config: configs/experiments_single_month_multiseed.yaml
panel_file: data/features/grid_month_panel.parquet
neighbors_file: data/features/neighbors.parquet
poi_dir: data/features/poi_sparse
poi_cache_size: 12
split_dir: data/splits
split_experiment: single_month_cross_region_multiseed
artifact_dir: outputs/single_month_multiseed_mean_mlp_gate/runs
report_dir: outputs/single_month_multiseed_mean_mlp_gate/reports
period: '202208'
seeds:
- 42
- 43
- 44
device: auto
models:
- opencarbon_monthly
training:
  representation_dim: 128
  dropout: 0.2
  learning_rate: 0.001
  weight_decay: 0.0001
  max_epochs: 25
  contrastive_warmup_epochs: 2
  contrastive_weight: 0.1
  patience: 5
  batch_size: 16
  gradient_accumulation: 2
  amp: true
  num_workers: 2
  persistent_workers: true
  prefetch_factor: 2
  temperature: 0.07
  neighborhood_aggregation: mean_mlp_gate
