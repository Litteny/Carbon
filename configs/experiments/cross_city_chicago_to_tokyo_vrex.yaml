data_config: configs/data.yaml
experiment_config: configs/experiments.yaml
panel_file: data/features/grid_month_panel.parquet
neighbors_file: data/features/neighbors.parquet
poi_dir: data/features/poi_sparse
poi_embedding_dir: data/features/poi_embeddings/cross_city_chicago_to_tokyo_attention_seed_42
poi_embedding_checkpoint_template: outputs/opencarbon_attention/runs/cross_city_chicago_to_tokyo/{fold}/opencarbon_monthly/seed_{seed}/best.pt
split_dir: data/splits
split_experiment: cross_city_chicago_to_tokyo
artifact_dir: outputs/stage1_vrex_tuned/runs
report_dir: outputs/stage1_vrex_tuned/reports/cross_city_chicago_to_tokyo
seed: 42
device: auto
models:
- opencarbon_monthly_precomputed
- opencarbon_monthly_vrex
training:
  representation_dim: 128
  dropout: 0.2
  learning_rate: 0.0003
  record_train_r2: true
  weight_decay: 0.0001
  max_epochs: 25
  contrastive_warmup_epochs: 5
  contrastive_weight: 0.01
  invariance_weight: 1.0
  invariance_warmup_epochs: 2
  environment_key: period
  patience: 8
  batch_size: 36
  gradient_accumulation: 2
  amp: true
  num_workers: 2
  temperature: 0.07
