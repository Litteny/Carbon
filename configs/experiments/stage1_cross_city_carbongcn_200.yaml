data_config: configs/data.yaml
experiment_config: configs/experiments.yaml
panel_file: data/features/grid_month_panel.parquet
neighbors_file: data/features/neighbors.parquet
poi_dir: data/features/poi_sparse
split_dir: data/splits
split_experiment: cross_city
artifact_dir: outputs/carbongcn_200/runs
seed: 42
device: auto
models:
- carbongcn
training:
  representation_dim: 128
  dropout: 0.2
  learning_rate: 0.001
  weight_decay: 0.0001
  max_epochs: 200
  contrastive_warmup_epochs: 2
  contrastive_weight: 0.1
  patience: 20
  batch_size: 16
  gradient_accumulation: 2
  amp: true
  num_workers: 2
  temperature: 0.07
report_dir: outputs/carbongcn_200/reports/cross_city
