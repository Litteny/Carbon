data_config: configs/data.yaml
experiment_config: configs/experiments.yaml
panel_file: data/features/grid_month_panel.parquet
neighbors_file: data/features/neighbors.parquet
poi_dir: data/features/poi_sparse
poi_embedding_dir: data/features/poi_embeddings/cross_city_seed_42
poi_embedding_checkpoint_template: outputs/stage1/runs/cross_city/{fold}/opencarbon_monthly/seed_{seed}/best.pt
split_dir: data/splits
split_experiment: cross_city
artifact_dir: outputs/smoke/vrex_runs
seed: 42
device: cpu
smoke_max_rows_per_split: 64
models:
- opencarbon_monthly_vrex
training:
  representation_dim: 128
  dropout: 0.2
  learning_rate: 0.001
  weight_decay: 0.0001
  max_epochs: 3
  contrastive_warmup_epochs: 5
  contrastive_weight: 0.01
  invariance_weight: 1.0
  invariance_warmup_epochs: 2
  environment_key: city_id
  patience: 1
  batch_size: 6
  gradient_accumulation: 1
  amp: false
  num_workers: 0
  temperature: 0.07
report_dir: outputs/smoke/vrex_reports
