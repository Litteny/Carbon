[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-transfer"
version = "0.1.0"
description = "Cross-city and cross-region monthly carbon transfer experiments"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["carbon_transfer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

